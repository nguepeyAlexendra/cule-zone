<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Culé Zone</title>
<style>
:root{--bg:#050b1f;--card:#0c1a40;--line:#1d3a8a;--b:#004d98;--g:#a50044;--t:#f2f5ff;--m:#9fb0dd;--ok:#12a37a;--gold:#edbb00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{background:var(--bg);color:var(--t);min-height:100%}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:14px 14px 84px;background:radial-gradient(circle at 50% 0,#10286a 0,var(--bg) 55%)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{flex:1;text-align:center;font-size:18px}.bk{background:none;border:0;color:var(--t);font-size:22px;width:30px}
.bar{height:8px;background:#14275f;border-radius:9px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),#2f7bff);border-radius:9px}
.pg{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--m);margin-bottom:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(90deg,var(--g),var(--b));cursor:pointer;margin-top:10px}
.btn.o{background:transparent;border:1px solid var(--line);color:var(--m)}
.crest{width:64px;height:76px;margin:0 auto;background:linear-gradient(90deg,var(--b) 50%,var(--g) 50%);border:3px solid var(--gold);border-radius:6px 6px 50% 50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff}
.crest.s{width:34px;height:40px;font-size:11px;margin:0;border-width:2px}
.splash{text-align:center;padding-top:40px}.splash h1{font-family:Georgia,serif;font-style:italic;font-size:54px;margin:18px 0 2px}.splash h1 span{display:block;font-size:44px}
.splash p{font-style:italic;color:var(--m);margin:12px 0 80px}
.hero{height:130px;border-radius:16px;margin:12px 0;display:flex;align-items:flex-end;padding:14px;font-family:Georgia,serif;font-style:italic;font-size:26px;background:linear-gradient(135deg,var(--b),var(--g));border:1px solid var(--line)}
.menu{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--line)}
.menu b{display:block}.menu small{color:#dbe3ff;opacity:.8}.menu em{margin-left:auto;font-style:normal;font-size:22px}
.m1{background:linear-gradient(90deg,#5b1050,#2a2a8a)}.m2{background:linear-gradient(90deg,#10388f,#1a56c9)}.m3{background:linear-gradient(90deg,#8a0b45,#4a2a9a)}.m4{background:linear-gradient(90deg,#1e4cc0,#4a35b5)}
.q{font-size:18px;line-height:1.4;margin:6px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:9px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--t);font-size:16px;cursor:pointer}
.opt span{width:26px;height:26px;border-radius:7px;background:#14275f;display:grid;place-items:center;font-size:13px}
.opt.ok{background:#0b4a45;border-color:var(--ok)}.opt.ko{background:#4a1030;border-color:#d6336c}
.fb{padding:12px;border-radius:12px;background:#0b3a3a;border:1px solid var(--ok);margin:8px 0;font-size:14px}
.grid{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:34px;cursor:pointer;color:var(--t)}
.cell.f{border-color:var(--ok);background:#0b4a45}.cell.h{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}.cell.sel{outline:3px solid var(--gold)}
.pz{aspect-ratio:1;border-radius:6px;border:1px solid #000;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:flex-start;padding:4px;cursor:pointer;background-size:300% 300%;background-image:radial-gradient(circle at 50% 50%,var(--gold) 0 14%,transparent 15%),repeating-linear-gradient(90deg,var(--b) 0 11%,var(--g) 11% 22%)}
.sm{font-size:13px;color:var(--m);text-align:center;margin-top:10px}
.res{text-align:center}.res h1{font-family:Georgia,serif;font-style:italic;font-size:34px;margin:10px 0}
.stats{display:flex;gap:8px;margin:14px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;color:var(--m)}.stats b{display:block;font-size:22px;color:var(--t)}
.note{background:#e9dcc0;color:#3a2e1c;border-radius:6px;padding:16px;text-align:left;font-family:Georgia,serif;line-height:1.5;transform:rotate(-1deg);margin-top:12px;font-size:15px}
.bub{background:#10214e;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;line-height:1.45}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:auto;display:flex;background:#08122e;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--m);font-size:12px;cursor:pointer}.nav button.a{color:#4d8dff}.nav i{display:block;font-style:normal;font-size:20px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card);margin-bottom:6px;font-size:14px}.row b{margin-left:auto}.row.me{border:1px solid #2f7bff}
.tabs{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px}.tabs button{flex:1;border:0;padding:9px;border-radius:8px;background:none;color:var(--m);font-weight:700}.tabs .a{background:linear-gradient(90deg,var(--b),#2f7bff);color:#fff}
.bdg{display:flex;gap:8px;margin:8px 0 14px}.bdg div{flex:1;text-align:center;font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px}.bdg i{display:block;font-style:normal;font-size:26px}
</style></head><body><div id="app"></div>
<script>
/* ==================== IMAGES : REMPLACE ICI LES CHEMINS ====================
   Mets tes images dans un dossier "images" à côté de ce fichier.
   Si une image est absente, le dessin de secours s'affiche à la place. */
const IMG={
logo:"images/logo.png",                 // 1. écusson (PNG transparent)
splash:"images/accueil-fond.jpg",       // 2. écran de démarrage (vertical)
hero:"images/banniere-joueurs.jpg",     // 3. bannière accueil (large, 2:1)
quiz:"images/quiz.jpg",                 // 4. photo du quiz (3:2) ; ajoute quiz2, quiz3... pour varier
erreur1:"images/erreur-1.jpg",          // 5. trouve l'erreur : image du haut (15:8)
erreur2:"images/erreur-2.jpg",          //    image du bas, avec les 5 différences
puzzle:"images/puzzle.jpg",             // 6. puzzle (carré)
memo1:"images/memo-1.jpg",              // 7. mémo : photo joueur 1 (carré)
memo2:"images/memo-2.jpg",              //    photo joueur 2
memo3:"images/memo-3.jpg",              //    photo joueur 3
defi:"images/defi-banniere.jpg",        // 8. bannière du défi fan (large)
resultat:"images/resultat-fond.jpg",    // 9. fond de l'écran résultat
surprise:"images/surprise-fond.jpg",    // 10. fond de la surprise (vertical)
papier:"images/papier.jpg"              //     papier du petit mot
};
/* ========================================================================== */
const $=s=>document.querySelector(s),A=$("#app");
const S={pts:0,won:0,streak:0,hist:[]};
const NAMES={quiz:"Quiz Barça",err:"Trouve l’erreur",pz:"Puzzle Barça",memo:"Mémo Barça",fan:"Défi fan"};
const D={
quiz:[["Qui a marqué le 2e but du Barça en finale de la Ligue des Champions 2011 contre Manchester United ?",["Messi","Iniesta","Xavi","Villa"],0,"Messi a marqué le 2e but à Wembley (3-1)."],
["Qui est le meilleur buteur de l’histoire du Barça ?",["Xavi","Messi","Suárez","Eto’o"],1,"Messi, avec plus de 670 buts en Blaugrana."],
["Comment s’appelle le centre de formation du Barça ?",["La Fábrica","L’Ajax Youth","La Masia","Clairefontaine"],2,"La Masia a formé Xavi, Iniesta, Messi, Pedri…"],
["Combien de Ligues des Champions le Barça a-t-il gagnées ?",["3","4","5","6"],2,"1992, 2006, 2009, 2011 et 2015."],
["Dans quel stade joue le Barça ?",["Bernabéu","Camp Nou","San Siro","Mestalla"],1,"Le Camp Nou, ‘Spotify Camp Nou’."]],
fan:[["Depuis quelle année le FC Barcelone joue-t-il au Camp Nou ?",["1954","1957","1959","1962"],1,"Le Camp Nou a été inauguré en 1957."],
["Quelle est la devise du club ?",["Visca el Barça","Més que un club","Hala Barça","Força Catalunya"],1,"« Més que un club », plus qu’un club."],
["Quelles sont les couleurs du club ?",["Blanc et or","Rouge et noir","Bleu et grenat","Vert et blanc"],2,"Blaugrana : bleu et grenat."],
["En quelle année le Barça a-t-il gagné sa 1re Ligue des Champions ?",["1986","1992","1999","2006"],1,"1992, à Wembley contre la Sampdoria."]]};
const nav=a=>`<div class="nav">${[["home","🏠","Accueil"],["scores","🏆","Scores"],["prof","👤","Profil"]].map(n=>`<button class="${a==n[0]?"a":""}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join("")}</div>`;
const hd=(t,b="home")=>`<div class="top"><button class="bk" onclick="go('${b}')">←</button><h2>${t}</h2><span style="width:30px"></span></div>`;
function go(p){window.scrollTo(0,0);({splash,home,scores,prof,surprise})[p]()}
function splash(){A.innerHTML=`<div class="splash"><div class="crest">FCB</div><h1>Culé<span>Zone</span></h1><p>Ici, on ne cesse jamais d’y croire.</p><button class="btn" onclick="go('home')">Commencer  →</button></div>`}
function home(){A.innerHTML=`<div class="top"><div class="crest s">FCB</div><div style="flex:1"><b>Salut Culé !</b><div class="sm" style="margin:0;text-align:left">Prêt à prouver ta passion ?</div></div></div>
<div class="hero">Més que<br>un club ♥</div>
<div class="menu m1" onclick="quiz('quiz')"><span style="font-size:26px">🧠</span><div><b>Quiz Barça</b><small>Teste tes connaissances !</small></div><em>›</em></div>
<div class="menu m2" onclick="err()"><span style="font-size:26px">🖼️</span><div><b>Trouve l’erreur</b><small>Es-tu un vrai observateur ?</small></div><em>›</em></div>
<div class="menu m3" onclick="pz()"><span style="font-size:26px">🧩</span><div><b>Jeu de puzzle</b><small>Reconstitue l’équipe !</small></div><em>›</em></div>
<div class="menu m4" onclick="quiz('fan')"><span style="font-size:26px">🎯</span><div><b>Défi fan</b><small>Montre ta passion !</small></div><em>›</em></div>
<div class="menu m1" onclick="memo()"><span style="font-size:26px">🃏</span><div><b>Mémo Barça</b><small>Retrouve les paires !</small></div><em>›</em></div>${nav("home")}`}
function quiz(k){const d=D[k];let i=0,sc=0;(function show(){const x=d[i];A.innerHTML=hd(NAMES[k])+`<div class="pg"><div class="bar"><i style="width:${i/d.length*100}%"></i></div>${i+1}/${d.length}</div><div class="q">${x[0]}</div>`+x[1].map((o,j)=>`<button class="opt" data-j="${j}"><span>${"ABCD"[j]}</span>${o}</button>`).join("")+(k=="fan"?`<div style="position:relative;height:100px;border-radius:14px;overflow:hidden;margin-top:6px;background:linear-gradient(135deg,#0b2a7a,#7a0a3a);display:grid;place-items:center"><img src="${IMG.defi}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()"><span style="position:relative;font:28px 'Kaushan Script',cursive;text-shadow:0 2px 8px #000">Visca el Barça !</span></div>`:"")+`<div id="fb"></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;document.querySelectorAll(".opt").forEach(o=>{o.onclick=null;if(+o.dataset.j==x[2])o.classList.add("ok")});if(j==x[2])sc++;else b.classList.add("ko");
$("#fb").innerHTML=`<div class="fb"><b>${j==x[2]?"✅ Bonne réponse !":"❌ Raté !"}</b><br>${x[3]}</div><button class="btn" id="nx">${i+1<d.length?"Suivant":"Voir le résultat"}</button>`;$("#nx").onclick=()=>{i++;i<d.length?show():result(k,sc,d.length)}})})()}
function err(){const a=["⚽","🏆","👟","🧤","🥅","🛡️","🎽","📣","🚩"],b=[...a];[1,3,4,6,8].forEach((n,j)=>b[n]=["🥇","🧢","🏟️","🎽","🚩"][j]==a[n]?"❓":["🥇","🧢","🏟️","👕","🏁"][j]);let f=new Set,h=0;
const draw=()=>{A.innerHTML=hd(NAMES.err)+`<div class="pg"><div class="bar"><i style="width:${f.size*20}%"></i></div>${f.size}/5</div><div class="sm" style="margin:0 0 8px">Observe bien les deux images et trouve les 5 différences (touche l’image du bas).</div><div class="grid g3">${a.map(c=>`<div class="cell">${c}</div>`).join("")}</div><div class="sm">↓</div><div class="grid g3" style="margin-top:6px">${b.map((c,n)=>`<div class="cell ${f.has(n)?"f":""}" onclick="T(${n})">${c}</div>`).join("")}</div><button class="btn o" onclick="H()">🔍 Indice (${3-h})</button>`};
window.T=n=>{if(a[n]!=b[n]){f.add(n);f.size==5?result("err",Math.max(1,5-h),5):draw()}};
window.H=()=>{if(h>=3)return;const n=[1,3,4,6,8].find(x=>!f.has(x));h++;draw();document.querySelectorAll(".grid")[1].children[n].classList.add("h")};draw()}
function pz(){let o=[...Array(9).keys()],sel=-1;do o.sort(()=>Math.random()-.5);while(o.every((v,i)=>v==i));
const draw=()=>{A.innerHTML=hd(NAMES.pz)+`<div class="sm" style="margin:0 0 10px">Reconstitue l’image en remettant les pièces dans le bon ordre (touche deux pièces pour les échanger).</div><div class="grid g3">${o.map((v,i)=>`<div class="pz ${sel==i?"sel":""}" style="background-position:${v%3*50}% ${Math.floor(v/3)*50}%;background-image:url('${IMG.puzzle}'),radial-gradient(circle at 50% 50%,var(--gold) 0 14%,transparent 15%),repeating-linear-gradient(90deg,var(--b) 0 11%,var(--g) 11% 22%)" onclick="P(${i})">${v+1}</div>`).join("")}</div><button class="btn o" onclick="V()">○ Vérifier</button><div class="sm" id="pm"></div>`};
window.P=i=>{if(sel<0)sel=i;else{[o[sel],o[i]]=[o[i],o[sel]];sel=-1}draw()};
window.V=()=>o.every((v,i)=>v==i)?result("pz",1,1):$("#pm").textContent="Pas encore… continue !";draw()}
function memo(){const e=["🛡️","⚽","🏆","👟","🧤","🥅"];let c=[...e,...e].sort(()=>Math.random()-.5),op=[],done=new Set,mv=0,lock=0;
const draw=()=>{A.innerHTML=hd(NAMES.memo)+`<div class="pg"><div class="bar"><i style="width:${done.size/12*100}%"></i></div>${done.size/2}/6</div><div class="sm" style="margin:0 0 10px">Retrouve les paires de cartes.</div><div class="grid g4">${c.map((x,i)=>`<div class="cell" onclick="C(${i})">${done.has(i)||op.includes(i)?x:"🔵"}</div>`).join("")}</div><div class="sm">Coups : ${mv}</div><button class="btn o" onclick="memo()">↻ Recommencer</button>`};
window.C=i=>{if(lock||done.has(i)||op.includes(i))return;op.push(i);if(op.length==2){mv++;lock=1;draw();setTimeout(()=>{if(c[op[0]]==c[op[1]])op.forEach(n=>done.add(n));op=[];lock=0;done.size==12?result("memo",Math.max(1,6-Math.floor((mv-6)/3)),6):draw()},700)}else draw()};draw()}
function result(k,sc,tot){const p=Math.round(sc/tot*50);S.pts+=p;S.hist.unshift([NAMES[k],sc,tot,p]);if(sc/tot>=.5){S.won++;S.streak++}else S.streak=0;
A.innerHTML=`<div class="res"><div class="crest" style="transform:scale(.8)">FCB</div><h1>Tu es un vrai Culé !</h1><div class="pg" style="justify-content:center">Ton score : ${sc}/${tot}</div><div class="bar" style="margin:0 20px"><i style="width:${sc/tot*100}%"></i></div><p class="sm" style="font-style:italic">« Le Barça, c’est plus qu’un club, c’est une façon de vivre. »</p><div class="stats"><div><b>${sc}</b>bonnes réponses</div><div><b>+${p}</b>points gagnés</div><div><b>${S.pts}</b>total</div></div><button class="btn" onclick="go('surprise')">❤️ Voir la surprise</button><button class="btn o" onclick="go('home')">Retour à l’accueil</button></div>`}
function surprise(){A.innerHTML=`<img class="sbg" src="${IMG.surprise}" onerror="this.remove()">`+hd("La surprise…")+`<div class="bub" style="text-align:center;font-weight:700;font-size:17px">Un vrai Culé ne baisse jamais les bras.</div><div class="note" style="background:#e9dcc0 url('${IMG.papier}') center/cover">Au Barça, on ne gagne pas toujours.<br>Mais on ne renonce jamais.<br><br>Un soir, on était menés 4-0 à Paris… et au Camp Nou, on en a mis six.<br><br>Voilà ce qu’est un Culé : quelqu’un qui croit encore quand tout le monde a arrêté de croire.<br><br>Alors relève la tête.<br>La plus belle remontada est toujours devant toi.</div><p class="sm" style="font-weight:700;letter-spacing:.5px">Més que un club · Visca el Barça !</p><button class="btn" onclick="go('home')">Revenir au menu</button>`}
function scores(t="Amis"){const L=[["BarçaForever",280],["MessiFan",250],["PedriMagic",220],["BlaugranaGirl",180],["Lamine10",150],["BarçaPassion",120],["ViscaBarça",90]],G=[["CulerGlobal",980],["Camp_Nou_92",870],["Masia_Kid",760],["Remuntada",640]];
const r=[...(t=="Amis"?L:G),["Culé Zone",S.pts]].sort((a,b)=>b[1]-a[1]);
A.innerHTML=hd("Classement")+`<div class="tabs"><button class="${t=="Amis"?"a":""}" onclick="scores('Amis')">Amis</button><button class="${t=="Global"?"a":""}" onclick="scores('Global')">Global</button></div>`+r.map((x,i)=>`<div class="row ${x[0]=="Culé Zone"?"me":""}"><span>${i+1}</span>${x[0]}<b>${x[1]} pts</b></div>`).join("")+nav("scores")}
function prof(){const lv=Math.floor(S.pts/100)+1;A.innerHTML=hd("Mon Profil")+`<div class="row"><div class="crest s">FCB</div><div><b style="margin:0">Culé Zone</b><div class="sm" style="margin:0;text-align:left">Vrai supporter · Niveau ${lv}</div></div></div><div class="bar" style="margin:8px 0"><i style="width:${S.pts%100}%"></i></div><div class="sm" style="margin:0 0 12px">${S.pts}/${lv*100} pts</div><div class="stats"><div><b>${S.won}</b>parties gagnées</div><div><b>${S.hist.length}</b>jeux joués</div><div><b>${S.streak}</b>série en cours</div></div><b>Mes badges</b><div class="bdg"><div><i>🛡️</i>Vrai Culé</div><div><i>⭐</i>Expert Barça</div><div><i>🏆</i>Champion</div><div><i>🔥</i>Remuntada</div></div><b>Historique des scores</b><div style="margin-top:8px">${S.hist.length?S.hist.slice(0,6).map(h=>`<div class="row">${h[0]}<span class="sm" style="margin:0 0 0 auto">${h[1]}/${h[2]}</span><b style="margin:0">+${h[3]} pts</b></div>`).join(""):'<div class="sm">Aucun jeu pour l’instant. Lance une partie !</div>'}</div>`+nav("prof")}
splash();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Kaushan+Script&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,system-ui,sans-serif}
.splash{position:relative;padding-top:50px;min-height:calc(100vh - 28px);overflow:hidden;border-radius:18px;background:radial-gradient(circle at 15% 8%,#2b5bd6 0,transparent 28%),radial-gradient(circle at 85% 10%,#c4175a 0,transparent 28%),linear-gradient(#0b1a4d,#050b1f 62%,#0b3a2a)}
.splash h1{font-family:'Kaushan Script',cursive;font-style:normal;font-size:64px;line-height:.9;margin:14px 0 4px;text-shadow:0 4px 20px #000}.splash h1 span{display:block;font-size:54px;font-family:inherit}
.splash p{margin:12px 0 0}.splash .btn{position:absolute;left:18px;right:18px;bottom:22px;width:auto}
.hero{height:150px;padding:0;position:relative;overflow:hidden;display:block}.hero svg{position:absolute;inset:0;width:100%;height:100%}.hero b{position:absolute;left:14px;bottom:10px;font:26px/1.1 'Kaushan Script',cursive;text-shadow:0 2px 8px #000}
.res h1{font-family:'Kaushan Script',cursive;font-style:normal;font-size:38px}
.note{font:500 20px/1.3 Caveat,cursive;transform:rotate(-1.5deg)}
.nav svg{display:block;margin:0 auto 2px}.ic{width:44px;height:44px;border-radius:12px;background:#ffffff1f;display:grid;place-items:center;flex:none}
.cell svg{width:58%;height:58%}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--b),var(--g));display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.stats svg{display:block;margin-bottom:4px}.lk{background:none;border:0;color:#4d8dff;text-decoration:underline;display:block;margin:14px auto 0;font-size:14px}
#app{position:relative}.cell{position:relative}
.splash>img,.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.splash h1,.splash p{position:relative;z-index:1}.splash>span,.splash .btn{z-index:1}.hero>b{z-index:1}
.res>*{position:relative;z-index:1}.res>img.bgi{position:absolute;top:0;left:0;width:100%;height:280px;object-fit:cover;border-radius:16px;opacity:.6;z-index:0}
.sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;z-index:0;pointer-events:none}.sbg~*{position:relative;z-index:1}
</style>
<script>
const I=(p,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const PT={brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5 3 3 0 0 0 4 4v3h2V4z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5 3 3 0 0 1-4 4"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',puz:'<path d="M5 7h4a2 2 0 1 1 4 0h5v4a2 2 0 1 0 0 4v4H5z"/>',tgt:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',card:'<rect x="4" y="6" width="10" height="14" rx="2"/><path d="M9 4h9a2 2 0 0 1 2 2v10"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>',cup:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"/>',usr:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',ball:'<circle cx="12" cy="12" r="9"/><path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4zM12 3v5M20 9l-4.5 1.5M17 19l-2.8-4.5M7 19l2.8-4.5M4 9l4.5 1.5"/>',shield:'<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',bolt:'<path d="M13 2L5 13h6l-1 9 8-12h-6z"/>',heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/>',flag:'<path d="M6 21V4h11l-2 4 2 4H6"/>'};
const IC=(k,s)=>I(PT[k],s);
const CR0=(w=64)=>`<svg width="${w}" height="${w*1.15}" viewBox="0 0 60 69" style="display:block;margin:auto"><path d="M4 4h52v30c0 18-12 28-26 33C16 62 4 52 4 34z" fill="#edbb00"/><path d="M7 7h46v27c0 16-10 25-23 30C17 59 7 50 7 34z" fill="#004d98"/><path d="M30 7h23v27c0 16-10 25-23 30z" fill="#a50044"/><rect x="7" y="7" width="23" height="14" fill="#fff"/><path d="M16 7h5v14h-5zM7 12h23v4H7z" fill="#d1122a"/><rect x="30" y="7" width="23" height="14" fill="#edbb00"/><path d="M34 7v14M39 7v14M44 7v14M49 7v14" stroke="#d1122a" stroke-width="2"/><circle cx="30" cy="45" r="8" fill="#fff" stroke="#111" stroke-width="1.2"/><path d="M30 41l3.5 2.5-1.3 4h-4.4l-1.3-4z" fill="#111"/><rect x="9" y="23" width="42" height="8" fill="#edbb00"/><text x="30" y="29.5" font-size="7" font-weight="900" text-anchor="middle" fill="#a50044">FCB</text></svg>`;
const CR=w=>`<span style="position:relative;display:block;width:${w}px;height:${w*1.15}px;margin:auto">${CR0(w)}<img src="${IMG.logo}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()"></span>`;
const PH={ball:"memo1",cup:"memo2",star:"memo3"};
const BG=`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1a4a"/><stop offset="1" stop-color="#050b1f"/></linearGradient><pattern id="st" width="18" height="10" patternUnits="userSpaceOnUse"><rect width="9" height="10" fill="#004d98"/><rect x="9" width="9" height="10" fill="#a50044"/></pattern></defs><rect width="300" height="160" fill="url(#bg)"/><circle cx="40" cy="0" r="70" fill="#2b5bd6" opacity=".25"/><circle cx="270" cy="0" r="70" fill="#c4175a" opacity=".25"/><g fill="#fff" opacity=".8"><circle cx="20" cy="10" r="2"/><circle cx="60" cy="6" r="1.5"/><circle cx="110" cy="12" r="2"/><circle cx="190" cy="8" r="2"/><circle cx="240" cy="12" r="1.5"/></g>`;
const PL=(x,n,u,y=0,c='#edbb00')=>`<g transform="translate(${x},${y})"><ellipse cy="30" rx="16" ry="19" fill="#6b4630"/><path d="M-16 28q0-22 16-22t16 22q-16-8-32 0z" fill="#1b120d"/><rect x="-6" y="44" width="12" height="10" fill="#6b4630"/><path d="M-40 160V74q0-18 22-22l18-3 18 3q22 4 22 22v86z" fill="url(#st)"/><path d="M-18 52q18 12 36 0" fill="none" stroke="${c}" stroke-width="3"/><text y="88" font-size="10" font-weight="800" text-anchor="middle" fill="#fff" letter-spacing="1">${n}</text><text y="134" font-size="46" font-weight="900" text-anchor="middle" fill="#fff" stroke="#edbb00" stroke-width="1">${u}</text></g>`;
const SC=b=>`<svg viewBox="0 0 300 160" style="width:100%;border-radius:14px;display:block;border:1px solid var(--line)">${BG}${b?'':'<path d="M270 14l2.4 5 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z" fill="#edbb00"/>'}${PL(55,'MESSI',b?11:10,0,b?'#fff':'#edbb00')}${PL(150,b?'PEDRO':'PEDRI',8)}${PL(245,'GAVI',b?9:6)}</svg>`;
const NAV=a=>`<div class="nav">${[["home","home","Accueil"],["scores","cup","Scores"],["prof","usr","Profil"]].map(n=>`<button class="${a==n[0]?"a":""}" onclick="go('${n[0]}')">${IC(n[1],22)}${n[2]}</button>`).join("")}</div>`;
function splash(){A.innerHTML=`<div class="splash"><img src="${IMG.splash}" onerror="this.remove()">${CR(86)}<h1>Culé<span>Zone</span></h1><p>Ici, on ne cesse jamais d’y croire.</p><button class="btn" onclick="go('home')">Commencer  →</button></div>`}
function home(){const m=(c,i,t,s,f)=>`<div class="menu ${c}" onclick="${f}"><div class="ic">${IC(i,24)}</div><div><b>${t}</b><small>${s}</small></div><em>›</em></div>`;
A.innerHTML=`<div class="top">${CR(34)}<div style="flex:1"><b>Salut Culé !</b><div class="sm" style="margin:0;text-align:left">Prêt à prouver ta passion ?</div></div></div><div class="hero"><svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice">${BG}${PL(60,'MESSI',10,15)}${PL(150,'PEDRI',8,15)}${PL(240,'GAVI',6,15)}</svg><img src="${IMG.hero}" onerror="this.remove()"><b>Més que<br>un club ♥</b></div>`+m("m1","brain","Quiz Barça","Teste tes connaissances !","quiz('quiz')")+m("m2","img","Trouve l’erreur","Es-tu un vrai observateur ?","err()")+m("m3","puz","Jeu de puzzle","Reconstitue l’équipe !","pz()")+m("m4","tgt","Défi fan","Montre ta passion !","quiz('fan')")+m("m1","card","Mémo Barça","Retrouve les paires !","memo()")+NAV("home")}
function quiz(k){const d=D[k];let i=0,sc=0;(function show(){const x=d[i];A.innerHTML=hd(NAMES[k])+`<div class="pg"><div class="bar"><i style="width:${i/d.length*100}%"></i></div>${i+1}/${d.length}</div><div class="q">${x[0]}</div>`+(k=="quiz"?`<div style="position:relative;height:120px;border-radius:14px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)"><svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%">${BG}${PL(150,'BARÇA',10,-8)}</svg><img src="${IMG["quiz"+(i+1)]||IMG.quiz}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()"></div>`:"")+x[1].map((o,j)=>`<button class="opt" data-j="${j}"><span>${"ABCD"[j]}</span>${o}</button>`).join("")+(k=="fan"?`<div style="position:relative;height:100px;border-radius:14px;overflow:hidden;margin-top:6px;background:linear-gradient(135deg,#0b2a7a,#7a0a3a);display:grid;place-items:center"><img src="${IMG.defi}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()"><span style="position:relative;font:28px 'Kaushan Script',cursive;text-shadow:0 2px 8px #000">Visca el Barça !</span></div>`:"")+`<div id="fb"></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;document.querySelectorAll(".opt").forEach(o=>{o.onclick=null;if(+o.dataset.j==x[2])o.classList.add("ok")});if(j==x[2])sc++;else b.classList.add("ko");$("#fb").innerHTML=`<div class="fb"><b style="color:${j==x[2]?"#3ee0a8":"#ff7aa8"}">${j==x[2]?"✔ Bonne réponse !":"✖ Raté !"}</b><br>${x[3]}</div><button class="btn" id="nx">${i+1<d.length?"Suivant":"Voir le résultat"}</button>`;$("#nx").onclick=()=>{i++;i<d.length?show():result(k,sc,d.length)}})})()}
function err(){let f=new Set,h=0,hint=-1;const HS=[[5,62,27,29],[37,47,26,10],[69,62,27,29],[5,29,27,12],[85,5,10,20]];
const draw=()=>{A.innerHTML=hd(NAMES.err)+`<div class="pg"><div class="bar"><i style="width:${f.size*20}%"></i></div>${f.size}/5</div><div class="sm" style="margin:0 0 8px;text-align:left">Observe bien les deux images et trouve les 5 différences.</div><div style="position:relative">${SC(0)}<img src="${IMG.erreur1}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px" onerror="this.remove()"></div><div style="height:8px"></div><div style="position:relative">${SC(1)}<img src="${IMG.erreur2}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;pointer-events:none" onerror="this.remove()">${HS.map((r,n)=>`<div onclick="T(${n})" style="position:absolute;left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%;border-radius:8px;${f.has(n)?"border:2px solid #12a37a":hint==n?"border:2px solid #edbb00;box-shadow:0 0 10px #edbb00":""}"></div>`).join("")}</div><button class="btn o" style="width:auto;padding:10px 26px;display:block;margin:12px auto" onclick="H()">Indice (${3-h})</button>`};
window.T=n=>{f.add(n);hint=-1;f.size==5?result("err",Math.max(1,5-h),5):draw()};window.H=()=>{if(h>=3)return;hint=[0,1,2,3,4].find(x=>!f.has(x));h++;draw()};draw()}
function memo(){const e=["ball","cup","shield","star","bolt","heart"];let c=[...e,...e].sort(()=>Math.random()-.5),op=[],done=new Set,mv=0,lock=0;
const draw=()=>{A.innerHTML=hd(NAMES.memo)+`<div class="pg"><div class="bar"><i style="width:${done.size/12*100}%"></i></div>${done.size/2}/6</div><div class="sm" style="margin:0 0 10px;text-align:left">Retrouve les paires de cartes.</div><div class="grid g3" style="grid-template-columns:repeat(4,1fr)">${c.map((x,i)=>`<div class="cell" onclick="C(${i})" style="${done.has(i)||op.includes(i)?"color:#edbb00":"background:#0f2160"}">${done.has(i)||op.includes(i)?IC(x,30)+(PH[x]?`<img src="${IMG[PH[x]]}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:11px" onerror="this.remove()">`:""):CR(22)}</div>`).join("")}</div><div class="sm">Coups : ${mv}</div><button class="btn o" onclick="memo()">↻ Recommencer</button>`};
window.C=i=>{if(lock||done.has(i)||op.includes(i))return;op.push(i);if(op.length==2){mv++;lock=1;draw();setTimeout(()=>{if(c[op[0]]==c[op[1]])op.forEach(n=>done.add(n));op=[];lock=0;done.size==12?result("memo",Math.max(1,6-Math.floor((mv-6)/3)),6):draw()},700)}else draw()};draw()}
function result(k,sc,tot){S.last=k;const p=Math.round(sc/tot*50);S.pts+=p;S.hist.unshift([NAMES[k],sc,tot,p]);if(sc/tot>=.5){S.won++;S.streak++}else S.streak=0;
A.innerHTML=`<div class="res"><img class="bgi" src="${IMG.resultat}" onerror="this.remove()">${CR(76)}<h1>Tu es un vrai Culé !</h1><div style="font-weight:700">Ton score : ${sc}/${tot}</div><div class="bar" style="margin:10px 24px"><i style="width:${sc/tot*100}%"></i></div><p class="sm" style="font-style:italic">« Le Barça, c’est plus qu’un club, c’est une façon de vivre. »</p><div class="stats"><div style="color:#edbb00">${IC("star",20)}<b style="color:#f2f5ff">${sc}</b>bonnes réponses</div><div style="color:#ff7a3d">${IC("bolt",20)}<b style="color:#f2f5ff">${k=="err"?5-sc:0}</b>indices utilisés</div><div style="color:#edbb00">${IC("cup",20)}<b style="color:#f2f5ff">1</b>écran débloqué</div></div><button class="btn" onclick="go('surprise')">Voir la surprise ❤️</button><button class="btn o" onclick="REJ()">↻ Rejouer</button><button class="lk" onclick="go('home')">Retour à l’accueil</button></div>`}
function REJ(){const k=S.last;k=="quiz"||k=="fan"?quiz(k):window[k]()}
function scores(t="Amis"){const L=[["BarçaForever",280],["MessiFan",250],["PedriMagic",220],["BlaugranaGirl",180],["Lamine10",150],["BarçaPassion",120],["ViscaBarça",90]],G=[["CulerGlobal",980],["Camp_Nou_92",870],["Masia_Kid",760],["Remuntada",640]];const r=[...(t=="Amis"?L:G),["Culé Zone",S.pts]].sort((a,b)=>b[1]-a[1]);
A.innerHTML=hd("Classement")+`<div class="tabs"><button class="${t=="Amis"?"a":""}" onclick="scores('Amis')">Amis</button><button class="${t=="Global"?"a":""}" onclick="scores('Global')">Global</button></div>`+r.map((x,i)=>`<div class="row ${x[0]=="Culé Zone"?"me":""}"><span style="width:18px;color:${i<3?"#edbb00":"#9fb0dd"};font-weight:800">${i+1}</span><div class="av">${x[0][0]}</div>${x[0]}<b>${x[1]} pts</b></div>`).join("")+NAV("scores")}
function prof(){const lv=Math.floor(S.pts/100)+1,gd="#edbb00";const bd=[["shield","Vrai Culé"],["star","Expert Barça"],["cup","Champion"],["bolt","Remuntada"]];
A.innerHTML=hd("Mon Profil")+`<div class="row">${CR(34)}<div><b style="margin:0">Culé Zone</b><div class="sm" style="margin:0;text-align:left">Vrai supporter</div></div></div><div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span class="av" style="width:auto;padding:4px 10px;border-radius:8px;background:var(--b)">Niveau ${lv}</span><div class="bar"><i style="width:${S.pts%100}%"></i></div><span class="sm" style="margin:0">${S.pts}/${lv*100} pts</span></div><div class="stats"><div style="color:${gd}">${IC("star",20)}<b style="color:#f2f5ff">${S.won}</b>Parties gagnées</div><div style="color:${gd}">${IC("cup",20)}<b style="color:#f2f5ff">${S.hist.filter(h=>h[0]=="Défi fan").length}</b>Défi terminé</div><div style="color:#ff7a3d">${IC("bolt",20)}<b style="color:#f2f5ff">${S.streak}</b>Série en cours</div></div><b>Mes badges</b><div class="bdg">${bd.map(b=>`<div style="color:${gd}">${IC(b[0],26)}<span style="color:#f2f5ff">${b[1]}</span></div>`).join("")}</div><b>Historique des scores</b><div style="margin-top:8px">${S.hist.length?S.hist.slice(0,6).map(h=>`<div class="row">${h[0]}<span class="sm" style="margin:0 0 0 auto">${h[1]}/${h[2]}</span><b style="margin:0 0 0 8px;color:#3ee0a8">+${h[3]} pts</b></div>`).join(""):'<div class="sm">Aucun jeu pour l’instant. Lance une partie !</div>'}</div>`+NAV("prof")}
splash();
</script></body></html>
